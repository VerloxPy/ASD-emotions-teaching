{% extends "base.html" %}
{% block title %}Історія{% endblock %}
{% block topbar %}{% include "partials/_lessonbar.html" %}{% endblock %}
{% block content %}
<section class="sheet novel-sheet">
  <h1 class="question">{{ exercise.prompt }}</h1>

  <div class="novel-wrap" id="novelWrap">
    <iframe class="novel-frame" id="novel" src="{{ novel_url }}" title="{{ exercise.prompt }}" allow="fullscreen"></iframe>
    <button type="button" class="novel-fs" id="novelFs" aria-label="На весь екран">⛶ На весь екран</button>
  </div>
  <p class="novel-hint">Для зручності поверни телефон горизонтально 📱</p>

  <div id="feedback" class="feedback" aria-live="polite"></div>
</section>

<script>
window.addEventListener("message", async function (event) {
  if (event.origin !== window.location.origin) return;
  if (!event.data || event.data.type !== "novel_result") return;
  var response = await fetch("{% url 'lessons:novel_result' exercise.id %}", {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}"},
    body: JSON.stringify(event.data.payload),
  });
  if (!response.ok) return;
  document.getElementById("feedback").innerHTML = await response.text();
  var index = parseInt(response.headers.get("X-Step-Index"), 10);
  window.markStepDone(index);

  // Вихід з повного екрана, щоб було видно відповідь і кнопку «Далі»
  if (document.fullscreenElement) {
    try { await document.exitFullscreen(); } catch (e) {}
  }
  document.getElementById("feedback").scrollIntoView({behavior: "smooth", block: "start"});
});

// Повний екран + ландшафт (Android/Chrome). На iOS Safari fullscreen для блоку недоступний.
(function () {
  var wrap = document.getElementById("novelWrap");
  var btn = document.getElementById("novelFs");
  if (!wrap.requestFullscreen) { btn.hidden = true; return; }

  btn.addEventListener("click", async function () {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        return;
      }
      await wrap.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape").catch(function () {});
      }
    } catch (e) {}
  });

  document.addEventListener("fullscreenchange", function () {
    var full = !!document.fullscreenElement;
    btn.textContent = full ? "✕ Вийти" : "⛶ На весь екран";
    if (!full && screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  });
})();
</script>
{% endblock %}
